<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carro de perfil">
<defs>
  <linearGradient id="pBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#39414c"/>
    <stop offset=".16" stop-color="#252b33"/>
    <stop offset=".30" stop-color="#191d23"/>
    <stop offset=".44" stop-color="#12151a"/>
    <stop offset=".56" stop-color="#242a32"/>
    <stop offset=".66" stop-color="#171b21"/>
    <stop offset=".86" stop-color="#0e1116"/>
    <stop offset="1"   stop-color="#0a0c10"/>
  </linearGradient>

  <linearGradient id="pStrip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#9fb2c8" stop-opacity="0"/>
    <stop offset=".06" stop-color="#a9bacf" stop-opacity=".18"/>
    <stop offset=".26" stop-color="#dfe9f6" stop-opacity=".48"/>
    <stop offset=".44" stop-color="#b9c9dc" stop-opacity=".34"/>
    <stop offset=".64" stop-color="#dfe9f6" stop-opacity=".40"/>
    <stop offset=".90" stop-color="#8fa2b8" stop-opacity=".16"/>
    <stop offset="1"   stop-color="#8fa2b8" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="pBelt" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#000" stop-opacity=".46"/>
    <stop offset=".40" stop-color="#000" stop-opacity=".08"/>
    <stop offset=".62" stop-color="#93aac4" stop-opacity=".12"/>
    <stop offset="1"   stop-color="#93aac4" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="pLow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#000" stop-opacity="0"/>
    <stop offset=".38" stop-color="#000" stop-opacity=".42"/>
    <stop offset=".74" stop-color="#000" stop-opacity=".34"/>
    <stop offset=".92" stop-color="#8fa0b2" stop-opacity=".20"/>
    <stop offset="1"   stop-color="#b3c2d3" stop-opacity=".30"/>
  </linearGradient>

  <linearGradient id="pEdgeHi" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ecf3fc" stop-opacity=".44"/>
    <stop offset="1" stop-color="#ecf3fc" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="pEnds" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#000" stop-opacity=".22"/>
    <stop offset=".12" stop-color="#000" stop-opacity="0"/>
    <stop offset=".88" stop-color="#000" stop-opacity="0"/>
    <stop offset="1"   stop-color="#000" stop-opacity=".18"/>
  </linearGradient>

  <linearGradient id="pGlass" x1=".10" y1="0" x2=".62" y2="1">
    <stop offset="0"   stop-color="#7f94ad" stop-opacity=".40"/>
    <stop offset=".36" stop-color="#313d4a" stop-opacity=".48"/>
    <stop offset=".72" stop-color="#1a2028" stop-opacity=".54"/>
    <stop offset="1"   stop-color="#3d4d60" stop-opacity=".44"/>
  </linearGradient>
  <linearGradient id="pGlassTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#000" stop-opacity=".42"/>
    <stop offset=".50" stop-color="#000" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="pTire" cx=".40" cy=".28" r=".82">
    <stop offset=".46" stop-color="#2b2f35"/>
    <stop offset=".78" stop-color="#171b1f"/>
    <stop offset="1"   stop-color="#08090c"/>
  </radialGradient>
  <radialGradient id="pRim" cx=".33" cy=".24" r=".86">
    <stop offset="0"   stop-color="#e8eff6"/>
    <stop offset=".40" stop-color="#9ca8b5"/>
    <stop offset=".76" stop-color="#59626d"/>
    <stop offset="1"   stop-color="#2d333a"/>
  </radialGradient>
  <linearGradient id="pSpoke" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0"   stop-color="#f3f7fc"/>
    <stop offset=".42" stop-color="#b0bbc8"/>
    <stop offset="1"   stop-color="#4e565f"/>
  </linearGradient>

  <linearGradient id="pHead" x1="0" y1="0" x2=".85" y2=".7">
    <stop offset="0"   stop-color="#ffffff"/>
    <stop offset=".24" stop-color="#cbdcef"/>
    <stop offset=".62" stop-color="#5a6e86"/>
    <stop offset="1"   stop-color="#151b22"/>
  </linearGradient>
  <linearGradient id="pTail" x1="1" y1="0" x2="0" y2=".7">
    <stop offset="0"   stop-color="#ff969b"/>
    <stop offset=".28" stop-color="#e2202a"/>
    <stop offset=".74" stop-color="#881015"/>
    <stop offset="1"   stop-color="#2e0407"/>
  </linearGradient>

  <linearGradient id="pCabin" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0"   stop-color="#171c22"/>
    <stop offset=".45" stop-color="#0d1116"/>
    <stop offset="1"   stop-color="#161b21"/>
  </linearGradient>
  <radialGradient id="pFloor" cx=".5" cy=".5" r=".5">
    <stop offset="0"   stop-color="#000" stop-opacity=".85"/>
    <stop offset=".42" stop-color="#000" stop-opacity=".34"/>
    <stop offset="1"   stop-color="#000" stop-opacity="0"/>
  </radialGradient>

