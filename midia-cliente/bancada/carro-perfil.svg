<svg class="carro-svg" viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SUV moderno visto de perfil, com as quatro áreas de vidro destacadas">
  <!--
    The Dark Film — simulador de película. SUV/crossover de perfil.
    Desenhado e julgado a 505 px (desktop) e 330 px (celular), não ampliado.
    Sem <g> com transform global: o carro foi dimensionado nas coordenadas,
    para não escalar junto o tracejado que o CSS aplica nos vidros.
    Geometria: chão y=167,2 · eixos x=81,2 e x=312,2 · pneu r=33 · arco r=40,7
    (folga uniforme de 7,7) · linha de cintura y≈77 · teto y≈23.
  -->
  <defs>
    <!-- carroceria: teto claro, realce de ombro na cintura, degrau de saia embaixo -->
    <linearGradient id="dfBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#363e4a"/>
      <stop offset=".06"  stop-color="#2e3641"/>
      <stop offset=".30"  stop-color="#1f262e"/>
      <stop offset=".40"  stop-color="#242b34"/>
      <stop offset=".47"  stop-color="#3a4350"/>
      <stop offset=".55"  stop-color="#232a33"/>
      <stop offset=".70"  stop-color="#1a2028"/>
      <stop offset=".775" stop-color="#171d24"/>
      <stop offset=".79"  stop-color="#0c1015"/>
      <stop offset=".92"  stop-color="#090c10"/>
      <stop offset="1"    stop-color="#06080b"/>
    </linearGradient>
    <!-- vidro: a área mais clara do desenho, para separar das colunas escuras -->
    <linearGradient id="dfGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#bccfe2"/>
      <stop offset=".55" stop-color="#8698ad"/>
      <stop offset="1"   stop-color="#647691"/>
    </linearGradient>
    <linearGradient id="dfRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#d5dce4"/>
      <stop offset=".5"  stop-color="#9aa4b1"/>
      <stop offset="1"   stop-color="#5e6773"/>
    </linearGradient>
    <linearGradient id="dfRoofHi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".20"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dfHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#eaf2ff"/>
      <stop offset="1"   stop-color="#8ea7c4"/>
    </linearGradient>
    <linearGradient id="dfTail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#e8393c"/>
      <stop offset="1"   stop-color="#8d1d1d"/>
    </linearGradient>
    <radialGradient id="dfShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#000" stop-opacity=".75"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sombra de chão: o carro fica apoiado com folga, não afundado -->
  <ellipse cx="200" cy="170.4" rx="187" ry="9.9" fill="url(#dfShadow)"/>

  <!-- caixas de roda: escuro atrás da carroceria, é o que faz a folga do pneu aparecer -->
  <path d="M 41.5 142.9 A 40.7 40.7 0 1 1 120.9 142.9 Z" fill="#06080b"/>
  <path d="M 272.5 142.9 A 40.7 40.7 0 1 1 351.9 142.9 Z" fill="#06080b"/>

  <!-- carroceria: capô com quebra clara no topo do paralama, cintura definida,
       traseira em sequência contínua (coluna C → vigia → tampa → para-choque) -->
  <path d="M 26.2 72.4
           C 57 71.4 83.4 71.4 107.6 71.4
           L 162.6 29.6
           C 195.6 24 274.8 23 314.4 26.3
           C 343 29.6 367.2 40.6 378.2 59.3
           C 382.6 69.2 384.8 79.1 384.8 92.3
           L 384.8 129.7
           C 384.8 141.8 380.4 150.6 370.5 150.6
           L 360.6 150.6
           C 355.1 150.6 351.9 147.3 351.9 142.9
           A 40.7 40.7 0 1 0 272.5 142.9
           L 120.9 142.9
           A 40.7 40.7 0 1 0 41.5 142.9
           C 37.8 148.4 32.8 150.6 26.2 150.6
           C 18.5 150.6 15.2 144 15.2 135.2
           L 15.2 101.1
           C 15.2 89 18.5 78 26.2 72.4 Z"
        fill="url(#dfBody)"/>

  <!-- casulo da cabine: fundo escuro sob o teto; é ele que dá contraste às colunas -->
  <path d="M 107.6 76.9
           L 161.5 32.9
           C 195.6 27.4 274.8 26.3 313.3 29.6
           C 340.8 32.9 363.9 43.9 373.8 61.5
           C 377.1 68.1 378.2 72.4 378.2 76.9
           L 107.6 76.9 Z"
        fill="#0e1218"/>

  <!-- coroamento do teto -->
  <path d="M 184.6 25.4 C 224.2 23.3 274.8 23.2 310 25.8"
        fill="none" stroke="url(#dfRoofHi)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- vinco de ombro (único realce lateral; mais frisos empastam no tamanho real) -->
  <path d="M 65.8 81.2 C 145 80.4 255 80.7 373.8 85.6"
        fill="none" stroke="#8d9aad" stroke-width="1.2" opacity=".26"/>

  <!-- soleira -->
  <path d="M 121.9 142.9 L 271.5 142.9 L 266 134 L 127.4 134 Z" fill="#05070a" opacity=".7"/>

  <!-- recortes de porta -->
  <path d="M 154.9 79 L 154.9 140.6 M 230.8 79 L 230.8 142.9 M 301.2 78 L 301.2 93.4"
        fill="none" stroke="#6b7787" stroke-width="1.1" opacity=".17"/>

  <!-- maçanetas -->
  <rect x="189" y="90" width="19.8" height="4" rx="2" fill="#8b97a8" opacity=".85"/>
  <rect x="257.2" y="89.5" width="19.8" height="4" rx="2" fill="#8b97a8" opacity=".85"/>

  <!-- retrovisor -->
  <path d="M 153.8 78 L 136.2 74.7 C 130.7 73.6 129.6 80.2 135.1 82.4 L 151.6 84.6 Z" fill="#1a2029"/>

  <!-- farol (sem grade: de perfil puro a grade não aparece) -->
  <path d="M 17.4 80.2 L 46 82.4 C 52.6 83.5 52.6 89 46 90.1 L 16.3 90.1 C 15.2 86.8 15.2 82.4 17.4 80.2 Z"
        fill="url(#dfHead)"/>
  <!-- lanterna encostada na face traseira -->
  <path d="M 382.6 84.6 L 371.6 86.8 C 367.8 87.9 367.8 100 371.6 101.1 L 382.6 103.3 Z"
        fill="url(#dfTail)"/>

  <!-- rodas -->
  <g>
    <circle cx="81.2" cy="134" r="33" fill="#13161b"/>
    <circle cx="81.2" cy="134" r="25.3" fill="#1b1f26"/>
    <circle cx="81.2" cy="134" r="20.4" fill="url(#dfRim)"/>
    <circle cx="81.2" cy="134" r="14.3" fill="#1e242c"/>
    <g fill="url(#dfRim)">
      <rect x="78.3" y="116.4" width="5.7" height="13.2" rx="2.6"/>
      <rect x="78.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(72 81.2 134)"/>
      <rect x="78.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(144 81.2 134)"/>
      <rect x="78.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(216 81.2 134)"/>
      <rect x="78.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(288 81.2 134)"/>
    </g>
    <circle cx="81.2" cy="134" r="5.5" fill="#b0b8c4"/>
    <circle cx="81.2" cy="134" r="2.2" fill="#6a727e"/>
  </g>
  <g>
    <circle cx="312.2" cy="134" r="33" fill="#13161b"/>
    <circle cx="312.2" cy="134" r="25.3" fill="#1b1f26"/>
    <circle cx="312.2" cy="134" r="20.4" fill="url(#dfRim)"/>
    <circle cx="312.2" cy="134" r="14.3" fill="#1e242c"/>
    <g fill="url(#dfRim)">
      <rect x="309.3" y="116.4" width="5.7" height="13.2" rx="2.6"/>
      <rect x="309.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(72 312.2 134)"/>
      <rect x="309.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(144 312.2 134)"/>
      <rect x="309.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(216 312.2 134)"/>
      <rect x="309.3" y="116.4" width="5.7" height="13.2" rx="2.6" transform="rotate(288 312.2 134)"/>
    </g>
    <circle cx="312.2" cy="134" r="5.5" fill="#b0b8c4"/>
    <circle cx="312.2" cy="134" r="2.2" fill="#6a727e"/>
  </g>

  <!-- ==========================================================
       ÁREAS CLICÁVEIS — últimas no documento, para o clique chegar.
       Sem stroke/stroke-width/stroke-dasharray: quem define é o CSS
       do site (tracejado em repouso, branco no hover, vermelho ativo).
       ========================================================== -->
  <polygon data-vidro="parabrisa" fill="url(#dfGlass)" points="110.9,75.8 162.6,35.1 193.4,35.1 141.7,75.8"/>
  <polygon data-vidro="dianteiro" fill="url(#dfGlass)" points="154.9,76.9 206.6,35.1 230.8,34 230.8,76.9"/>
  <polygon data-vidro="traseiro"  fill="url(#dfGlass)" points="244,76.9 244,34 299,34.5 301.2,75.8"/>
  <polygon data-vidro="vigia"     fill="url(#dfGlass)" points="314.4,37.3 349.6,43.9 367.2,72.5 323.2,76.9"/>
</svg>
