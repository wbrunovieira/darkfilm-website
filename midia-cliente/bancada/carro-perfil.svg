      <g transform="rotate(72)"><path d="M-2.9,-5.8 L-4.4,-15.3 L0,-16.6 L4.4,-15.3 L2.9,-5.8 Z"/><path d="M0,-6.6 L2.9,-5.8 L4.4,-15.3 L0,-16.6 Z" fill="#000" fill-opacity=".36"/></g>
      <g transform="rotate(144)"><path d="M-2.9,-5.8 L-4.4,-15.3 L0,-16.6 L4.4,-15.3 L2.9,-5.8 Z"/><path d="M0,-6.6 L2.9,-5.8 L4.4,-15.3 L0,-16.6 Z" fill="#000" fill-opacity=".36"/></g>
      <g transform="rotate(216)"><path d="M-2.9,-5.8 L-4.4,-15.3 L0,-16.6 L4.4,-15.3 L2.9,-5.8 Z"/><path d="M0,-6.6 L2.9,-5.8 L4.4,-15.3 L0,-16.6 Z" fill="#000" fill-opacity=".36"/></g>
      <g transform="rotate(288)"><path d="M-2.9,-5.8 L-4.4,-15.3 L0,-16.6 L4.4,-15.3 L2.9,-5.8 Z"/><path d="M0,-6.6 L2.9,-5.8 L4.4,-15.3 L0,-16.6 Z" fill="#000" fill-opacity=".36"/></g>
    </g>
    <circle r="16.8" fill="none" stroke="url(#pRim)" stroke-width="2.5"/>
    <circle r="18.1" fill="none" stroke="#000" stroke-width="1" stroke-opacity=".5"/>
    <circle r="15.5" fill="none" stroke="#000" stroke-width=".7" stroke-opacity=".45"/>
    <circle r="5.4" fill="#2c333b"/>
    <circle r="5.4" fill="none" stroke="url(#pRim)" stroke-width="1.2"/>
    <circle r="1.8" fill="#0b0d10"/>
